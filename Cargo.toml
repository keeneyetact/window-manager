[package]
name = "windows-manager"
version = "0.1.1"
edition = "2024"

[dependencies]
eframe = "0.29"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
tray-icon = "0.26.1"
ureq = { version = "2", features = ["json"] }
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_LibraryLoader"] }
